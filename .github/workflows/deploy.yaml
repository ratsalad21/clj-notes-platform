name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]

env:
  AWS_REGION: us-east-2
  CLUSTER: notes-eks
  ECR_REPO: notes
  REGISTRY: 397614038828.dkr.ecr.us-east-2.amazonaws.com
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  deploy:
    runs-on: codebuild-notes-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE=$REGISTRY/$ECR_REPO:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "$IMAGE" ./app

      - name: Push to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$IMAGE"

      - name: Fail on critical vulnerabilities
        run: |
          TAG="${GITHUB_SHA::7}"
          aws ecr wait image-scan-complete --repository-name "$ECR_REPO" --image-id imageTag="$TAG"
          CRITICAL=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          echo "Critical findings: $CRITICAL"
          [ "$CRITICAL" = "None" ] || [ "$CRITICAL" = "0" ]

      - name: Install kubectl
        run: |
          curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          kubectl set image deployment/notes notes="$IMAGE"
          kubectl rollout status deployment/notes --timeout=180s